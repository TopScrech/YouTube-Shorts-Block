<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
    <main class="popup">
        <label class="toggle" for="enabled-toggle">
            <span class="toggle-label" data-i18n="block_shorts">Block Shorts</span>
            <span class="toggle-control">
                <input id="enabled-toggle" type="checkbox" checked>
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-thumb" aria-hidden="true"></span>
            </span>
        </label>
        <label class="toggle" for="playlist-toggle">
            <span class="toggle-label" data-i18n="playlist_button">Return to playlist button</span>
            <span class="toggle-control">
                <input id="playlist-toggle" type="checkbox" checked>
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-thumb" aria-hidden="true"></span>
            </span>
        </label>
        <label class="toggle" for="likes-toggle">
            <span class="toggle-label" data-i18n="hide_likes_dislikes">Hide likes/dislikes</span>
            <span class="toggle-control">
                <input id="likes-toggle" type="checkbox">
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-thumb" aria-hidden="true"></span>
            </span>
        </label>
        <label class="toggle" for="like-count-toggle">
            <span class="toggle-label" data-i18n="hide_like_count">Hide like count</span>
            <span class="toggle-control">
                <input id="like-count-toggle" type="checkbox">
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-thumb" aria-hidden="true"></span>
            </span>
        </label>
        <label class="toggle" for="comments-toggle">
            <span class="toggle-label" data-i18n="hide_comments">Hide comments</span>
            <span class="toggle-control">
                <input id="comments-toggle" type="checkbox">
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-thumb" aria-hidden="true"></span>
            </span>
        </label>
        <label class="toggle" for="subscriber-count-toggle" id="subscriber-count-row">
            <span class="toggle-label" data-i18n="hide_subscriber_count">Hide subscriber count</span>
            <span class="toggle-control">
                <input id="subscriber-count-toggle" type="checkbox">
                <span class="toggle-track" aria-hidden="true"></span>
                <span class="toggle-thumb" aria-hidden="true"></span>
            </span>
        </label>
    </main>
</body>
</html>
